# Access log keeps only method, path and status: no $args/$request, so tokens or emails that ever
# appear in a query string never reach the log. (Reset tokens travel in the URL fragment anyway.)
log_format lms_web '$time_iso8601 $request_method $uri $status';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log lms_web;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Asset có hash trong tên: cache 1 năm.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API: dùng khi chạy riêng nginx (compose "full"); production đi qua Caddy.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Không bao giờ mở đường nội bộ ra ngoài.
    location /internal/ {
        return 404;
    }

    # SPA: index.html không cache để bản deploy mới có hiệu lực ngay.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
