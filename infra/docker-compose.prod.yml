name: lms-prod

# Một VPS: Caddy (TLS tự động) → web (nginx tĩnh) và api; worker gửi email outbox.
# Postgres không mở cổng ra ngoài. Media nằm ở Cloudflare R2 (S3_*), không có service storage.
# Biến môi trường đọc từ infra/.env (xem infra/.env.example). Biến secret dùng ${VAR?...}: compose báo lỗi khi
# thiếu hẳn biến; giá trị rỗng bị API (config.Load) và Postgres từ chối lúc khởi động.

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-production}
  HTTP_ADDR: ":8080"
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://${DOMAIN}}
  DATABASE_URL: postgres://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lms}?sslmode=disable
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_TZ: ${APP_TZ:-Asia/Ho_Chi_Minh}
  SESSION_TTL: ${SESSION_TTL:-12h}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
  TEMP_PASSWORD_TTL: ${TEMP_PASSWORD_TTL:-72h}
  RESET_TOKEN_TTL: ${RESET_TOKEN_TTL:-30m}
  LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
  LOGIN_LOCK_WINDOW: ${LOGIN_LOCK_WINDOW:-15m}
  RATE_LIMIT_LOGIN_IP_PER_MIN: ${RATE_LIMIT_LOGIN_IP_PER_MIN:-300}
  RATE_LIMIT_FORGOT_IP_PER_MIN: ${RATE_LIMIT_FORGOT_IP_PER_MIN:-30}
  SMTP_HOST: ${SMTP_HOST:?đặt SMTP_HOST trong infra/.env}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER?đặt SMTP_USER trong infra/.env}
  SMTP_PASSWORD: ${SMTP_PASSWORD?đặt SMTP_PASSWORD trong infra/.env}
  MAIL_FROM: ${MAIL_FROM:?đặt MAIL_FROM trong infra/.env}
  MAIL_FAIL_PATTERN: ${MAIL_FAIL_PATTERN:-}
  EMAIL_POLL_INTERVAL: ${EMAIL_POLL_INTERVAL:-5s}
  OUTBOX_SECRET_KEY: ${OUTBOX_SECRET_KEY?đặt OUTBOX_SECRET_KEY trong infra/.env (openssl rand -base64 32)}
  S3_ENDPOINT: ${S3_ENDPOINT:?đặt S3_ENDPOINT trong infra/.env}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?đặt S3_PUBLIC_ENDPOINT trong infra/.env}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-lms-media}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY?đặt S3_ACCESS_KEY trong infra/.env}
  S3_SECRET_KEY: ${S3_SECRET_KEY?đặt S3_SECRET_KEY trong infra/.env}
  S3_USE_SSL: ${S3_USE_SSL:-true}
  MEDIA_URL_TTL: ${MEDIA_URL_TTL:-2h}
  MAX_VIDEO_BYTES: ${MAX_VIDEO_BYTES:-2147483648}
  MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-10485760}
  STALE_DAYS: ${STALE_DAYS:-7}

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms}
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?đặt POSTGRES_PASSWORD trong infra/.env (openssl rand -hex 24)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../apps/api
    restart: always
    environment:
      <<: *api-env
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/lms", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
    # Không publish cổng: chỉ Caddy (cùng mạng docker) gọi được api:8080.

  # Worker outbox email: cùng image với api; migrate chỉ do api chạy.
  worker:
    build:
      context: ../apps/api
    restart: always
    command: ["worker"]
    environment:
      <<: *api-env
      MIGRATE_ON_START: "false"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
    restart: always
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: always
    environment:
      DOMAIN: ${DOMAIN:?đặt DOMAIN trong infra/.env}
      ACME_EMAIL: ${ACME_EMAIL:?đặt ACME_EMAIL trong infra/.env (Caddy cần để xin chứng chỉ)}
      MEDIA_ORIGIN: ${MEDIA_ORIGIN:?đặt MEDIA_ORIGIN trong infra/.env (origin của S3_PUBLIC_ENDPOINT)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
